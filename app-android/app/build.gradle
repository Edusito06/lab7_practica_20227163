plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.lab6.iot'
    compileSdk 34

    defaultConfig {
        applicationId "com.lab6.iot"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Firebase UI (pantalla de inicio: correo + Google + recuperar contraseña)
    // OJO: NO agregar play-services-auth 21.x, rompe Firebase UI 8.0.2
    implementation 'com.firebaseui:firebase-ui-auth:8.0.2'

    // Graficos
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Microservicios (Lab 7): Retrofit + Gson para consumir servicio-estadisticas
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // UI
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
