spring:
  application:
    # OJO: con guion, NO guion bajo. Feign usa este nombre como si fuera un host.
    name: servicio-horas

server:
  # Segunda instancia: ./mvnw spring-boot:run -Dspring-boot.run.arguments=--server.port=8011
  port: 8010

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # Id unico por instancia: permite levantar varias del mismo servicio
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: Servicio de horas de estudio (proveedor)
    autor: 20227163
